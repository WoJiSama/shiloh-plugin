    adScan:
      enabled: true
    # 超长消息折叠：超过 maxLength 字的"普通"消息（未命中广告/刷屏风控）会被自动撤回，
    # 并把原内容按 1000 字/条转成一条合并聊天记录重新发出，内容不丢、只是不再刷屏。
    # 需要机器人是群管理；命中风控规则的消息仍走风控流程，不会被转发。
