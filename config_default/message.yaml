    chatReasoningEffort: low
    # 认真回答、进度确认及复杂回合的思考预算，默认 low；需要时可显式配置 medium/high/max。
    # false 或 none 只停止本轮覆盖，继承全局 chatReasoningEffort，不表示关闭模型思考。
    complexReasoningEffort: low
    chatApiUrl: https://api.openai.com/v1/chat/completions
    chatApiModel: gemini-2.5-pro
    chatApiKey: sk-xxxxx

  # 紧凑任务可单独配置快速后端；留空时按任务复用现有快模型或 chatAiConfig，不绑定任何模型厂商。
  taskAiConfig:
    # 短、无工具、非复杂的闲聊；留空时回退主对话模型。
    casual:
      apiUrl: ""
      model: ""
      apiKey: ""
      maxTokensField: max_tokens
      maxOutputTokens: 1200   # 思考型模型的 thinking 也计入 max_tokens,小额度会被思考耗光导致正文为空
      # 闲聊默认 low；档位可配置，必须思考的模型不支持 none；只配此档时借用 chat 后端
      reasoningEffort: low
    progress:
      apiUrl: ""
      model: ""
      apiKey: ""
      maxTokensField: max_tokens
      maxOutputTokens: 800    # 同上,给思考留余量
      reasoningEffort: ""
      timeoutMs: 6000
    translation:
      apiUrl: ""
      model: ""
      apiKey: ""
      maxTokensField: max_tokens
      reasoningEffort: ""
  imageEditAiConfig:
    imageEditApiUrl: https://api.openai.com/v1/chat/completions
    imageEditApiModel: gemini-3-pro-image-preview
    imageEditApiKey: sk-xxxxx

  imageGenerationAiConfig:
    providers:
      - name: image2
        apiUrl: https://api.openai.com/v1/images/generations
        model: gpt-image-2
        apiKey: sk-xxxxx
        size: 1024x1024
        squareSize: 1024x1024
        portraitSize: 1024x1536
        landscapeSize: 1536x1024
        autoSize: ""
        priority: 1
  analysisAiConfig:
    analysisApiUrl: https://api.openai.com/v1/chat/completions
    analysisApiModel: gemini-3-pro-preview
    analysisApiKey: sk-xxxxx
    timeoutMs: 45000

  searchAiConfig:
    searchApiUrl: https://api.openai.com/v1/chat/completions
    # 搜索后端域名被墙/DNS污染时填本地代理,例如 http://127.0.0.1:7890;留空走直连
    searchApiProxy: ""
    searchApiModel: deepseek-r1-search
    searchApiKey: sk-xxxxx
    timeoutMs: 20000

  memoryAiConfig:
    memoryAiUrl: https://api.openai.com/v1/chat/completions
    memoryAiModel: gpt-4o-mini
    memoryAiApikey: sk-xxxxx

  emotionSystem:
    enabled: true
    decayRate: 0.02
    eventWeights:
      praised: 0.1
      scolded: -0.15
      ignored: -0.05
      mentioned: 0.05
  memorySystem:
    enabled: false
    maxEntitiesPerGroup: 200
    maxFactsPerGroup: 50
    maxFactsPerEntity: 20
    saveStrictness: normal
    userExtractDebounceSeconds: 90
    userExtractMaxBatchMessages: 6
    groupExtractMinIntervalMinutes: 10
    groupExtractMaxBatchMessages: 12
    promptMaxGroupFacts: 6
    promptMaxEntityFacts: 6
    promptMaxChars: 1200
    semanticRecallEnabled: false
    reflectEntityThreshold: 15
    reflectGroupThreshold: 30
    proactiveCallback: true
    recallMaxMentionedEntities: 3
    proactiveWindowDaysBefore: 3
    proactiveWindowDaysAfter: 7
    semanticDupCosine: 0.88
    # 明确教会的群内通知/协作规则，与普通事实记忆分开保存和召回
    maxGroupWorkflows: 50
    workflowPromptMaxRules: 12
    maxGroupKnowledge: 100
    knowledgePromptMaxEntries: 8
    # 语义裁决的总超时（毫秒）。裁决在后台继续，超时只放弃本次写入，不阻塞主对话。
    knowledgeDecisionTimeoutMs: 900
    knowledgeDecisionMaxTokens: 400
    # 主回复最多等待裁决提交多久（毫秒）；超出后正常回复，不得声称“已记住”。
    knowledgeDecisionInlineWaitMs: 180
  expressionLearning:
    enabled: true
    minWordFrequency: 3
    maxWords: 50
    blockedWords: []
    aiLearningEnabled: true
    aiLearningMessageThreshold: 50
    # 同一群友在短时间内连续发送时，学习整轮的单条/多条与表情包位置
    sequenceWindowMs: 20000
    maxSequenceTurns: 3
    maxSequenceSamples: 30
  knowledgeSystem:
    enabled: false
    topN: 10
    threshold: 0.35
  embeddingAiConfig:
    embeddingApiUrl: https://api.openai.com/v1/embeddings
    embeddingApiModel: text-embedding-3-small
    embeddingApiKey: sk-xxxxx
  # 群聊长期记忆(RAG):归档滑窗分块 → 向量+BM25 混合召回 → RRF 融合注入主模型上下文
  # 保留期独立于归档(归档 7 天);索引是压缩精华,延长记忆跨度成本远低于延长归档
  semanticMemory:
    enabled: false
    retentionDays: 30
    includeGroups: []
    excludeGroups: []
    windowSize: 8
    stride: 4
    topK: 5
    minScore: 0.35
    contextMaxChars: 900
    retrieveTimeoutMs: 900
    indexOnWrite: true
    embeddingDimensions: 1024
    # 记忆强度演化(借鉴 A-Memorix):强度随时间衰减、被召回注入即强化并重置衰减时钟,
    # 排序按强度加权(近期/常想起的记忆上浮),低于冻结阈值的每日清扫时遗忘
    # 记忆自纠错:群友在对话里说"你记错了"且指向 bot 时,自动降权她上一轮引用的记忆
    # (降权非删除:基准强度下调且不重置衰减时钟,重复纠错自然淡忘,单次误伤不丢数据)
    selfCorrection:
      enabled: true
      penalty: 0.5             # 每次纠错下调的强度
      ttlMinutes: 10           # 她引用记忆后多久内的纠错才算数
    memoryEvolution:
      enabled: true
      halfLifeDays: 7          # 半衰期:7 天没人想起,强度减半
      reinforceBoost: 0.35     # 每次被召回注入提升的强度
      freezeThreshold: 0.06    # 低于此值视为淡忘(清扫时删除);0=只用保留期,不按强度遗忘
      flushBatch: 32           # 强化多少条后批量落盘
  # 中期记忆:每群滚动"主线摘要",补 60 分钟原文窗口与长期 RAG 之间的叙事空档。
  # 群聊攒够 minMessages 条新消息后,用记忆模型把旧摘要+新消息压成一份主线,注入提示词。
  # 依赖 memoryAiConfig(便宜小模型);三层记忆结构:原文(1h) → 主线叙事(此处) → 长期事实(RAG)。
  midtermMemory:
    enabled: true
    minMessages: 15        # 攒够多少条新消息触发一次摘要更新
    debounceMs: 20000      # 达到阈值后的防抖等待(继续攒批,减少模型调用)
    maxSummaryChars: 500   # 摘要长度上限
    retentionDays: 3       # 主线保留天数,过期自然淡忘
    model: ""              # 摘要模型,留空用 memoryAiModel
    # 重排(SiliconFlow 免费 bge-reranker-v2-m3):评估/调试默认启用,聊天热路径默认关闭
    rerankEnabled: true
    rerankInChat: false
    rerankModel: BAAI/bge-reranker-v2-m3
    rerankTopN: 20
    rerankTimeoutMs: 1500
  emojiSystem:
    enabled: false
    # 表情包以 QQ"表情"小图发送（sub_type=1）；置 false 恢复普通大图
    sendAsSticker: true
    # 入库标准补充规则（管理页可改）：追加到视觉审查提示词，一行一条
    admissionExtraAllow: []
    admissionExtraReject: []
    dbPath: plugins/shiloh-plugin/database/emoji-packs.ndjson
    storeDir: plugins/shiloh-plugin/database/emoji_files
    maxItems: 200
    autoCollect: false
    visionTagOnAdd: true
    useEmbedding: true
    selectionTopK: 5
    embeddingThreshold: 0.55
    contentFiltration: true
    # 双维审核：同一次审查同时输出「是否表情包」+「内容安全」+「置信度」，
    # 任一不过或置信度低于 contentFilterMinConfidence 都拒收（宁可漏收不错收）。
    contentSafetyFilter: true
    contentFilterMinConfidence: 0.75
    # emoji-only 回复后的冷却毫秒数（期间不再递表情工具给模型；explicit 请求不受限）
    emojiCooldownMs: 120000
    # 强制反应表情（"笑死/离谱/累死"等快路）的配文：从规则配文池抽样一句 leadText，
    # rate 为带文字的概率（0~0.8）；该群样本足够时按观察到的裸表情占比自适应（夹在 0.15~0.6）
    forcedReplyTextEnabled: true
    forcedReplyTextRate: 0.4
    doReplace: false
    enableMaintenance: false
    checkIntervalMinutes: 10
    stalePruneEnabled: false
    staleDays: 30
    staleCandidatePoolSize: 20
    stalePruneCount: 1
    minItemsToKeep: 50
    avoidRecentEnabled: true
    avoidRecentCount: 20
    avoidRecentTtlMinutes: 30
    # 表情认识感(借鉴 MaiBot"认识"视角):0=关闭。0.25=熟悉的表情小幅优先,
    # 新表情(没用过)首次发出时模型会收到"刚捡到"提示,可自然带一句认领口气
    familiarityBias: 0.25
    followUpDelayMinMs: 300
    followUpDelayMaxMs: 1200
    rateLimitEnabled: true
    rateLimitWindowMinutes: 1
    rateLimitMaxPerWindow: 3
  openai_tool_choice: auto
  # 语音系统：阶段一为 QQ 语音消息；阶段三会复用同一 provider 接实时通话/RTC。
  voiceSystem:
    enabled: false
    provider: volcengine
    maxTextLength: 80
    autoVoiceProbability: 0.0             # 预留：后续可用于短句低概率自动语音；当前仅工具调用/明确要求时发
    cleanupDelayMs: 300000
    volcengine:
      endpoint: "https://openspeech.bytedance.com/api/v3/tts/unidirectional"
      appId: ""
      accessToken: ""
      resourceId: ""                      # 火山 V3 资源 ID，例如你的声音复刻/豆包语音资源
      voiceType: ""                       # 希洛复刻后的音色 ID
      uid: "shiloh-plugin"
      format: "mp3"
      sampleRate: 24000
      speedRatio: 1.0
      pitchRatio: 1.0
      volumeRatio: 1.0
      emotion: ""
      stylePrompt: ""
    styles:
      normal: {}
      shy:
        speedRatio: 0.94
        pitchRatio: 1.03
        emotion: shy
      tease:
        speedRatio: 1.04
        pitchRatio: 1.02
      serious:
        speedRatio: 0.98
      sleepy:
        speedRatio: 0.9
        pitchRatio: 0.96
  # 三角洲行动第三方 API：所有接口请求统一带 Header: X-API-Key。
  deltaForceSystem:
    enabled: false
    apiBaseUrl: ""
    apiKey: ""
    timeoutMs: 10000
    objectCacheEnabled: true
    objectCacheRefreshMinutes: 360
  # 公开磁力搜索：默认使用 torrents-csv 索引，按关键词返回 infohash 后再拼磁链；只展示清单，不自动下载。
  magnetSearchSystem:
    enabled: true
    searchUrl: https://torrents-csv.com/service/search
    proxyUrl: http://127.0.0.1:7890
    timeoutMs: 10000
    proxyTimeoutMs: 8000
  # 受限磁链下载：先读取种子元数据，符合大小/文件数和 ZIP 上传限制后才下载；内容打成一个 ZIP 上传，目录和压缩包说明发合并转发。
  torrentDownload:
    enabled: true
    autoDetect: true
    aria2Binary: aria2c
    # 机房网络常拦截 DHT/UDP tracker;aria2 走该 HTTP 代理(--all-proxy 只覆盖 HTTP(S) tracker
    # 与 HTTP 下载,BT peer/DHT 的 UDP 不经它),配合下面的 HTTP tracker 是 P2P 元数据获取关键;
    # 种子内容下载阶段仍依赖 peer 可达,代理只保证元数据与 HTTP 通路。
    proxyUrl: http://127.0.0.1:7890
    zipBinary: zip
    downloadDir: data/torrent_downloads
    maxTotalMb: 50
    maxSingleFileMb: 50
    maxArchiveMb: 50
    maxFiles: 3
    maxMetadataMb: 2
    metadataDhtTimeoutSeconds: 20
    metadataTrackerTimeoutSeconds: 45
    # 仅在第一轮 DHT/P2P 元数据发现失败后补充，用于第二轮 P2P 查询。
    publicTrackers:
      - udp://tracker.opentrackr.org:1337/announce
      - udp://open.stealth.si:80/announce
      - udp://tracker.torrent.eu.org:451/announce
      - http://tracker.opentrackr.org:1337/announce
      - https://tracker.tamersunion.org:443/announce
      - http://tracker.dler.org:6969/announce
      - https://tracker.gbitt.info:443/announce
      - http://open.acgnxtracker.com:80/announce
    # 前两轮 P2P 都没有元数据时使用。仅接受 HTTPS，且 info 哈希必须匹配原磁链。
    metadataHttpTimeoutSeconds: 8
    metadataHttpSources:
      - https://itorrents.net/torrent/{infoHash}.torrent
      - https://torrage.info/torrent.php?h={infoHash}
    # 完整磁链超限但单个文件可下载时，保存给原发起人的待选文件清单时长（秒）。
    selectionTtlSeconds: 1800
    downloadTimeoutSeconds: 900
    archiveTimeoutSeconds: 60
    minFreeDiskMb: 512
  oneapi_tools:
    - likeTool
    - pokeTool
    - googleImageAnalysisTool
    - aiMindMapTool
    - bananaTool(dedupe)
    - bingImageSearchTool
    - changeCardTool
    - chatHistoryTool
    - deltaForceTool
    - excelWorkbookTool
    - modrinthTool
    - pixivSearchTool
    - pixivDownloadTool
    - githubRepoTool
    - googleImageEditTool(dedupe)
    - jinyanTool
    - qqZoneTool
    - searchInformationTool
    - searchMusicTool
    - searchVideoTool
    - videoAnalysisTool(dedupe)
    - voiceTool
    - webParserTool
    - reactionTool
    - memberInfoTool
    - mentionAdminsTool
    - mentionMembersTool
    - forgetGroupKnowledgeTool
    - recallTool
    - reminderTool
    - textImageTool
    - torrentDownloadTool(dedupe)
    - sendLocalEmojiTool
    - waitTool                            # 拟人化"稍后再说一句"；仅 chatTriggerMode=smart 且 smartTrigger.waitToolEnabled=true 时才会暴露给 LLM
    - sendGiftTool
  githubToken: ""
  qqMusicToken: ""
