# ================================================================
# 命令总表 —— 机器人全部命令的唯一权威定义处
#
# · 这里是给你看的说明书 + 给机器人生成帮助菜单的数据源
# · 修改保存后自动热更新，无需重启机器人
# · 发送「.命令 导出」可重新生成 docs/commands.md 快照文档
# · 正则匹配仍在各 app 代码里，这里的 usage 是展示用写法
#
# 字段说明：
#   usage  展示用法（[] 表示可选参数）
#   desc   一句话说明
#   perm   all=所有人 | admin=群管理 | master=仅主人
#   src    实现位置（文件名 处理函数），便于重构时定位
# ================================================================

domains:
  - key: memory
    name: 记忆与表达
    icon: "🧠"
    desc: 长期记忆、群记忆、群工作流、全局表达学习
    commands:
      - usage: "#记忆状态"
        desc: 查看记忆系统运行状态
        perm: all
        src: "domains/memory/commandsApp.js memoryStatus"
      - usage: "#记忆统计"
        desc: 查看记忆库统计
        perm: all
        src: "domains/memory/commandsApp.js memoryStats"
      - usage: "#我的记忆"
        desc: 列出我的长期记忆
        perm: all
        src: "domains/memory/commandsApp.js listMyMemory"
      - usage: "#群记忆"
        desc: 列出本群共享记忆
        perm: all
        src: "domains/memory/commandsApp.js listGroupMemory"
      - usage: "#搜索记忆 <关键词>"
        desc: 搜索记忆库
        perm: all
        src: "domains/memory/commandsApp.js searchMemory"
      - usage: "#删除记忆 <ID>"
        desc: 删除指定记忆条目
        perm: all
        src: "domains/memory/commandsApp.js deleteMemory"
      - usage: "#清空我的记忆 / #清空群记忆"
        desc: 清空个人或本群记忆
        perm: all
        src: "domains/memory/commandsApp.js clearMyMemory/clearGroupMemory"
      - usage: "#禁用我的记忆 / #启用我的记忆"
        desc: 开关我个人记忆写入
        perm: all
        src: "domains/memory/commandsApp.js disableMyMemory/enableMyMemory"
      - usage: "#群工作流"
        desc: 查看本群自动通知工作流
        perm: all
        src: "domains/memory/commandsApp.js listGroupWorkflows"
      - usage: "#删除群工作流 <ID>"
        desc: 删除指定工作流
        perm: all
        src: "domains/memory/commandsApp.js deleteGroupWorkflow"
      - usage: "#群知识"
        desc: 查看本群知识绑定（谁是谁、黑话等）
        perm: all
        src: "domains/memory/commandsApp.js listGroupKnowledge"
      - usage: "#删除群知识 <ID>"
        desc: 删除指定群知识
        perm: all
        src: "domains/memory/commandsApp.js deleteGroupKnowledge"
      - usage: ".表达学习 [状态|记忆|报告|总结|清空]"
        desc: 全局表达学习管理（无参数看帮助）
        perm: master
        src: "domains/memory/commandsApp.js globalStyleLearningCommand"
      - usage: ".希洛反馈 <内容>"
        desc: 对机器人说话风格提意见
        perm: all
        src: "domains/memory/commandsApp.js recordPersonaFeedback"

  - key: tools
    name: 工具与MCP
    icon: "🛠"
    desc: 本地工具调用与 MCP 服务管理
    commands:
      - usage: "#tool <内容>"
        desc: 调用本地工具
        perm: all
        src: "apps/test.js handleTool"
      - usage: "#mcp 重载"
        desc: 重新加载 MCP 服务配置
        perm: master
        src: "apps/test.js reloadMCP"
      - usage: "#mcp 列表"
        desc: 列出可用 MCP 工具
        perm: all
        src: "apps/test.js listMCPTools"
      - usage: "#mcp 状态"
        desc: 查看 MCP 连接状态
        perm: all
        src: "apps/test.js mcpStatus"
      - usage: "#mcp 测试 <工具名>"
        desc: 测试指定 MCP 工具
        perm: master
        src: "apps/test.js testMCPTool"

  - key: dice
    name: 骰子
    icon: "🎲"
    desc: COC7/DND 骰娘（sealdice 语义兼容）+ 规则包 + 海豹扩展 + 牌堆；回复文案可在命令管理页「骰子模板」里改
    commands:
      - usage: ".r <表达式>"
        desc: 掷骰，如 .r1d100 / .r 2d6+3 / .r 3#1d100 / .r 4d6kh3（取高丢低都支持）
        perm: all
        src: "domains/dice/app.js roll"
      - usage: ".ra <技能> <值> [困难|极难|大成功]"
        desc: COC 检定（支持难度前缀与 .ra b/p 奖惩骰）
        perm: all
        src: "domains/dice/app.js check"
      - usage: ".rav A 60 vs B 50"
        desc: 对抗检定；也可 .rav 斗殴 @对方
        perm: all
        src: "domains/dice/app.js opposed"
      - usage: ".rh <技能> <值>"
        desc: 暗骰，结果私聊发送
        perm: all
        src: "domains/dice/app.js hiddenCheck"
      - usage: ".sc <成功/失败> [SAN] [--half --cap=N]"
        desc: SAN Check（大失败时损失骰取最大）
        perm: all
        src: "domains/dice/app.js sanCheck"
      - usage: ".en <技能> [值]"
        desc: 成长检定（失败可成长 +1d10，自动写卡）
        perm: all
        src: "domains/dice/app.js enCheck"
      - usage: ".st <录入|show|showall|hide|del|clr>"
        desc: 人物卡管理（侦查=60 / san-1 增减 / 隐藏属性）
        perm: all
        src: "domains/dice/app.js st"
      - usage: ".pc <list|new|use|del|tag|lock>"
        desc: 多人物卡管理
        perm: all
        src: "domains/dice/app.js pc"
      - usage: ".coc7 [数量] / .dnd [数量]"
        desc: 生成 COC7/DND 属性
        perm: all
        src: "domains/dice/app.js coc|dnd"
      - usage: ".setcoc [0-5|无大失败]"
        desc: 查看或设置本群 COC 房规
        perm: all
        src: "domains/dice/app.js setCoc"
      - usage: ".bp/.pp [数量]"
        desc: 奖励骰/惩罚骰
        perm: all
        src: "domains/dice/app.js roll"
      - usage: ".ti / .li"
        desc: 临时疯狂/总结疯狂表
        perm: all
        src: "domains/dice/app.js ti|li"
      - usage: ".nn <昵称> / .sn on|off"
        desc: 骰娘显示名 / 自动群名片
        perm: all
        src: "domains/dice/app.js nn|sn"
      - usage: ".jrrp / .db [STR SIZ]"
        desc: 今日人品 / 伤害加值
        perm: all
        src: "domains/dice/app.js jrrp|db"
      - usage: ".draw <牌组> [keys|list|search|desc|reload]"
        desc: 牌堆抽牌与管理（牌堆文件放 config/decks/）
        perm: all
        src: "domains/dice/DeckManager.js"
      - usage: ".骰规则 [导入|确认|启用|禁用|列表|删除]"
        desc: 规则包/海豹扩展管理（三种格式：YAML/JS/海豹脚本）
        perm: master
        src: "domains/dice/DiceRulePackManager.js"
      - usage: ".<规则包命令> / .<海豹扩展命令>"
        desc: 已启用规则包与海豹扩展注册的命令（在命令管理页「骰子扩展」可见）
        perm: all
        src: "动态注册"

