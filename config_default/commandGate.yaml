# 命令门禁:权限/作用域之外的账号绑定层(utils/commandGate.js)。
# 多号同时在线时,通过"群 → 号"绑定决定哪个号响应哪个群的命令;
# 未命中绑定的群看 defaultBot;两者都为空时所有号都可响应(单号模式零影响)。
# 私聊不受账号绑定限制(主人私聊任意号都可用)。改完保存即生效(mtime 热更新)。

# 兜底绑定:未在 groups 里列出的群,由这个号响应。留空 = 不启用兜底。
defaultBot: ""

# 群 → 账号 精确绑定(QQ 群号: QQ 号)
groups: {}
#  "1079789636": "3094088525"
#  "240837518": "备号QQ号"

# 主人账号(叠加 Yunzai 自带的 master 判定,perm: master / admin 会用到)
masters: []
