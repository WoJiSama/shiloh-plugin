name: TypeScript migration gates
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            console/frontend/package-lock.json
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm ci --prefix console/frontend
      - run: npm run verify:phase
      - run: npm run release:pack
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-node-${{ matrix.node }}
          path: .release/
          include-hidden-files: true
